services:
  edge-proxy:
    container_name: edge-proxy
    restart: unless-stopped
    build:
      context: .
      dockerfile: dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - certs:/app/autocert
      - ./certs:/app/certs:ro,Z
      - ./config.yml:/app/config.yml:Z

volumes:
  certs:
