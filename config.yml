rate_limit:
  requests_per_second: 25
  burst: 50

http:
  address: ":80"
  redirect_to_https: true
  dashboard: info.zelchi.com
  fallback: solar.zelchi.com
  routes:
    - host: drive.zelchi.com
      upstream: http://host.docker.internal:7000
      preserve_host: true
    - host: foundry.zelchi.com
      upstream: http://host.docker.internal:30001
      preserve_host: true
    - host: luna.zelchi.com
      upstream: http://host.docker.internal:7676
      preserve_host: true
    - host: retro.zelchi.com
      upstream: http://host.docker.internal:6767
      preserve_host: true

https:
  address: ":443"
  tls:
    certs_dir: /app/autocert
    certs_fallback: /app/certs
    domains:
      - info.zelchi.com
      - solar.zelchi.com
      - foundry.zelchi.com
      - drive.zelchi.com
      - luna.zelchi.com
      - retro.zelchi.com
      - crash.zelchi.com

tcp:
  address: ":25000"
  routes:
    - host: minecraft.zelchi.com
      upstream: host.docker.internal:25565
    - host: pumpkin.zelchi.com
      upstream: host.docker.internal:25566
    - host: crash.zelchi.com
      upstream: host.docker.internal:25567

udp:
  address: ":20000"
  routes:
    - host: pumpkin.zelchi.com
      upstream: host.docker.internal:19132
