rate_limit:
  requests_per_second: 1000
  burst: 3000

http:
  address: ":80"
  redirect_to_https: true
  dashboard: info.zelchi.com
  fallback: solar.zelchi.com
  routes:
    - host: drive.zelchi.com
      upstream: http://host.docker.internal:7000
    - host: vtt.zelchi.com
      upstream: http://host.docker.internal:9333
    - host: foundry.zelchi.com
      upstream: http://host.docker.internal:30001
    - host: hunt.zelchi.com
      upstream: http://host.docker.internal:9222

https:
  address: ":443"
  tls:
    certs_dir: /app/autocert
    certs_fallback: /app/certs
    domains:
      - info.zelchi.com
      - solar.zelchi.com
      - vtt.zelchi.com
      - foundry.zelchi.com
      - hunt.zelchi.com
      - drive.zelchi.com

tcp:
  address: ":25000"
  routes:
    - host: minecraft.zelchi.com
      upstream: host.docker.internal:25565
    - host: pumpkin.zelchi.com
      upstream: host.docker.internal:25566

udp:
  address: ":19000"
  routes:
    - host: pumpkin.zelchi.com
      upstream: host.docker.internal:19132

turn:
  public_ip: 163.176.149.9
  tcp_address: ":3478"
  udp_address: ":3478"
  control_upstream: host.docker.internal:13478
  relay_min_port: 49160
  relay_max_port: 49259
  relay_upstream_host: host.docker.internal
  relay_upstream_base_port: 59160
  relay_command_base_port: 60160
  max_sessions: 4096
